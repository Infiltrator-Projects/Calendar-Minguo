name: Qualify and publish provider
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Initialise pinned Common source
        run: git submodule update --init -- common
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils pkg-config libglib2.0-dev libicu-dev jq ghostscript zip gzip gettext
      - name: Build and qualify portable and native providers without Python
        shell: bash
        run: |
          set -euo pipefail
          make check
          make release
          bash common/calendar-tools/check-package.sh dist/*.deb portable
          sudo bash common/calendar-tools/check-upgrade.sh dist/*.deb
          installer=$(realpath dist/*.run)
          "$installer" --help
          sudo "$installer" --profile aggressive --system-package-mode
          package="infiltrator-$(jq -r '.repository | ascii_downcase' SOURCE-MANIFEST.json)"
          test "$(dpkg-query -W -f='${Status}' "$package")" = 'install ok installed'
          version=$(cat VERSION)
          test "$(dpkg-query -W -f='${Version}' "$package")" = "$version+native1"
          test "$(dpkg-query -W -f='${X-Infiltrator-Native-Profile}' "$package")" = aggressive
          test "$(dpkg-query -W -f='${X-Infiltrator-PGO}' "$package")" = trained-two-pass
          resource_name=$(jq -r .name SOURCE-MANIFEST.json)
          repository=$(jq -r .repository SOURCE-MANIFEST.json)
          so="/System/Resources/Calendars/$resource_name.so"
          pdf="/System/Resources/Documentation/$repository.pdf"
          test -f "$so" && test -f "$pdf"
          test "$(head -c 5 "$pdf")" = '%PDF-'
          test "$(sha256sum "$so" | cut -d' ' -f1)" = "$(dpkg-query -W -f='${X-Infiltrator-Resource-SHA256}' "$package")"
          assets=(dist/*.deb dist/*.run dist/*.zip)
          test "${#assets[@]}" -eq 3
          jq -n \
            --arg commit "$GITHUB_SHA" --arg version "$version" --arg name "$resource_name" \
            --arg deb "$(basename "${assets[0]}")" --arg debsha "$(sha256sum "${assets[0]}" | cut -d' ' -f1)" \
            --arg run "$(basename "${assets[1]}")" --arg runsha "$(sha256sum "${assets[1]}" | cut -d' ' -f1)" \
            --arg zip "$(basename "${assets[2]}")" --arg zipsha "$(sha256sum "${assets[2]}" | cut -d' ' -f1)" \
            '{commit:$commit,version:$version,name:$name,assets:{($deb):$debsha,($run):$runsha,($zip):$zipsha}}' > dist/contract.json

      - name: Verify portable and installed native packages contain exactly one SO and one PDF
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/*.deb)
          test "${#packages[@]}" -eq 1
          pkg=$(dpkg-deb -f "${packages[0]}" Package)
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          dpkg-deb -x "${packages[0]}" "$stage"
          mapfile -d '' -t payload < <(find "$stage" ! -type d -print0)
          test "${#payload[@]}" -eq 2
          mapfile -d '' -t portable_so < <(find "$stage/System/Resources/Calendars" -type f -name '*.so' -print0)
          mapfile -d '' -t portable_pdf < <(find "$stage/System/Resources/Documentation" -type f -name '*.pdf' -print0)
          test "${#portable_so[@]}" -eq 1
          test "${#portable_pdf[@]}" -eq 1
          test "$(head -c 5 "${portable_pdf[0]}")" = '%PDF-'
          expected_pdf="$(jq -r .repository SOURCE-MANIFEST.json).pdf"
          test "$(basename "${portable_pdf[0]}")" = "$expected_pdf"
          mapfile -t installed < <(dpkg-query -L "$pkg" | while IFS= read -r path; do
            if [[ -f "$path" || -L "$path" ]]; then printf '%s\n' "$path"; fi
          done)
          test "${#installed[@]}" -eq 2
          mapfile -t native_so < <(printf '%s\n' "${installed[@]}" | grep -E '^/System/Resources/Calendars/.+\.so$')
          mapfile -t native_pdf < <(printf '%s\n' "${installed[@]}" | grep -E '^/System/Resources/Documentation/[^/]+\.pdf$')
          test "${#native_so[@]}" -eq 1
          test "${#native_pdf[@]}" -eq 1
          test "$(head -c 5 "${native_pdf[0]}")" = '%PDF-'
          test "$(basename "${native_pdf[0]}")" = "$expected_pdf"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: qualify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: provider-qualified-${{ github.sha }}
          path: release
      - name: Publish exactly the qualified three assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash packaging/publish.sh
